<!DOCTYPE html>

<head>

<meta name="description" content="A PS1-style castaway adventure. Wash ashore, follow the Rogue Agents' map, wake the four Rogue Pendulums, and take the Golden Idol of Chris Illic from El Bass Presidente." />
<meta property="og:title" content="Illic Isle" />
<meta property="og:description" content="PS1-style castaway adventure. Find the Golden Idol of Chris Illic." />
<link rel="stylesheet" href="css/style.css" />
<link rel="preload" href="fonts/pressstart2p.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/silkscreen.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23140d08'/%3E%3Crect x='5' y='2' width='6' height='4' fill='%23ffd24a'/%3E%3Crect x='4' y='6' width='8' height='6' fill='%23e0a92b'/%3E%3Crect x='3' y='12' width='10' height='2' fill='%23a8761c'/%3E%3C/svg%3E" />
</head>
<body>

<div id="viewport">
  <canvas id="game"></canvas>
</div>

<!-- ============ LOADING ============ -->
<div id="loading" class="screen">
  <div class="load-inner">
    <div class="load-logo">ILLIC ISLE</div>
    <div class="load-bar"><div id="load-fill"></div></div>
    <div id="load-text" class="load-text">NOW LOADING</div>
    <div class="load-hint">DO NOT TURN OFF YOUR CONSOLE</div>
  </div>
</div>

<!-- Every interface below the loading screen is drawn on the pixel
     canvas inside the PS1 pass — see js/lib/screens.js. -->
<div id="lightning"></div>

<!-- ============ MOBILE NOTICE ============ -->
<div id="nomobile" class="screen hidden">
  <div class="panel">
    <h2>KEYBOARD + MOUSE REQUIRED</h2>
    <p class="tip">Illic Isle needs a mouse and keyboard. Open this on a desktop or laptop, sailor.</p>
    <button class="mbtn" id="nomobile-anyway">TRY ANYWAY</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<!--
  A module that fails to parse or resolve dies before main.js ever runs, so
  none of its own error handling is in play and the page just sits on the
  loading screen forever with the reason only in the console. This inline
  script exists to put that reason on the screen. The commonest cause by
  far is a half-stale cache: one module updated, another not, and an import
  naming an export the old file has never heard of.
-->
<script>
(function () {
  var el = function () { return document.getElementById('load-text'); };
  var fired = false;
  function fail(what, detail) {
    if (fired) return;
    fired = true;
    var t = el(); if (!t) return;
    var stale = /does not provide an export|Cannot find module|Failed to fetch|Unexpected/i.test(detail || '');
    t.innerHTML = what + '<br><span style="font-size:.7em;opacity:.85">' + (detail || '') + '</span>'
      + (stale ? '<br><span style="font-size:.7em;color:#ffd24a">RELOAD WITH SHIFT HELD TO CLEAR THE CACHE</span>' : '');
    t.style.color = '#e0453a';
    var f = document.getElementById('load-fill'); if (f) f.style.background = '#8a2018';
  }
  window.addEventListener('error', function (e) {
    if (e.message || e.error) fail('FAILED TO START', String((e.error && e.error.message) || e.message));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    fail('FAILED TO START', String((e.reason && e.reason.message) || e.reason));
  });
  // and a backstop, in case something hangs without throwing at all
  setTimeout(function () {
    var t = el();
    if (t && /LOADING|^$/i.test(t.textContent.trim())) {
      fail('STILL LOADING', 'Nothing has reported in for 45 seconds.');
    }
  }, 45000);
})();
</script>

<!-- ?v is bumped whenever the module graph changes shape, so a browser
     holding half of the previous build cannot mix it with this one. -->
<script type="module" src="js/main.js?v=5"></script>
<noscript><div class="screen"><div class="panel"><h2>JAVASCRIPT REQUIRED</h2></div></div></noscript>
</body>
</html>
